# Container for the Snowsky Disc qemu emulator.
#
# 1. Point it at the firmware OTA chunk dir (…/main_os/ota_v240 of the unzipped firmware):
#      cp .env.example .env   &&   edit OTA_DIR   (or: OTA_DIR=/path ./run.sh up)
# 2. Start it:
#      docker compose up -d --build        (or ./run.sh up "$OTA_DIR", which also extracts+sets up)
# 3. Drive the pipeline (extract / setup / boot / tap …) with ./run.sh — see README.md.
#
# The container just idles (`sleep infinity`); all the work runs inside it via ./run.sh,
# which execs the /repo/scripts/* pipeline.
services:
  emu:
    build: ./docker
    image: diskos-qemu
    container_name: diskos-qemu          # fixed name so ./run.sh exec targets it
    privileged: true                     # qemu-user needs binfmt_misc, POSIX mqueue, a large VA reservation
    command: sleep infinity
    stop_grace_period: 2s
    volumes:
      - ${OTA_DIR:?set OTA_DIR in .env (path to the firmware main_os/ota_v240 dir)}:/ota:ro
      - ./:/repo                         # this repository (scripts, shim, tools)
      - ./sdcard:/sdcard                 # drop media here -> appears as the device's /tmp/sdcard (File Browser)
      - work:/work                       # extracted rootfs + runtime state (persists across restarts)
    ports:
      # FiiO Link services the emulated device binds. Forward-looking: lets a host client
      # (e.g. a FiiO-YMD-style bridge) reach the emulated player. See docs/PROTOCOL.md.
      # Comment out any that clash with something already on your host.
      - "12100:12100"                    # raw FiiO Link  (TCP, auth-free device control)
      - "12103:12103"                    # HTTP/WS control (TCP, Mongoose mg_dash)
      - "12101:12101/udp"                # discovery       (UDP)
      - "8080:8080"                      # live viewer + touch bridge (./run.sh view)

volumes:
  work:
    name: diskos-work        # explicit (unprefixed) name = reuse the volume the old run.sh made

