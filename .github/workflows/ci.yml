name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Firmware-free checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned Docker Engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v28.5.2
      - name: Pinned Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v2.39.4
          cache-binary: false
      - name: Validate Compose
        run: OTA_DIR=/tmp/unused docker compose config --quiet
      - name: Build pinned toolchain
        run: docker build --tag diskos-qemu-ci docker
      - name: Python, JavaScript, shell syntax and MIPS shims
        run: docker run --rm --network none --volume "$PWD:/repo:ro" diskos-qemu-ci bash /repo/ci/test.sh
