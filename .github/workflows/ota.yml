name: OTA check
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ota-check
  cancel-in-progress: false
jobs:
  check:
    name: Check stock firmware release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      update_available: ${{ steps.ota.outputs.update_available }}
      newer_release_available: ${{ steps.ota.outputs.newer_release_available }}
      target_version: ${{ steps.ota.outputs.target_version }}
      target_recovery: ${{ steps.ota.outputs.target_recovery }}
      latest_version: ${{ steps.ota.outputs.latest_version }}
      latest_recovery: ${{ steps.ota.outputs.latest_recovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test catalog handling
        run: |
          python3 -B -m unittest discover -s tools -p test_check_ota.py -v
          python3 -B -m unittest discover -s tools -p test_notify_ota.py -v
      - name: Read stock OTA catalog
        id: ota
        run: python3 -B tools/check_ota.py
      - name: Open release tracking issue
        if: steps.ota.outputs.newer_release_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OTA_CURRENT_VERSION: ${{ steps.ota.outputs.current_version }}
          OTA_CURRENT_RECOVERY: ${{ steps.ota.outputs.current_recovery }}
          OTA_LATEST_VERSION: ${{ steps.ota.outputs.latest_version }}
          OTA_LATEST_RECOVERY: ${{ steps.ota.outputs.latest_recovery }}
        run: python3 -B tools/notify_ota.py
