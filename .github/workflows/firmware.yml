name: Firmware integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-active
  cancel-in-progress: false
jobs:
  integration:
    name: Fresh active firmware integration
    if: github.ref == 'refs/heads/2.x'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Keep in sync with firmware.profile.DEFAULT_VERSION and its URL secret.
      # Promotion is a reviewed change, never an automatic OTA update.
      FW_VERSION: '2.57'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Docker Engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v28.5.2
      - name: Pinned Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v2.39.4
          cache-binary: false
      - name: Build pinned toolchain and run firmware-free checks
        run: |
          docker build --tag snowsky-disc-qemu-ci docker
          docker run --rm --network none --volume "$PWD:/repo:ro" snowsky-disc-qemu-ci bash /repo/ci/test.sh
      - name: Download private firmware input
        env:
          FIRMWARE_V257_URL: ${{ secrets.FIRMWARE_V257_URL }}
        run: |
          mkdir "$RUNNER_TEMP/snowsky-disc-ota"
          python3 -B -m firmware.tools.fetch_firmware "$RUNNER_TEMP/snowsky-disc-ota" --version "$FW_VERSION"
      - name: Fresh boot, stock library scan, TCP, WebSocket and PCM
        run: bash ci/integration.sh "$RUNNER_TEMP/snowsky-disc-ota"
      # No firmware/rootfs/guest logs/caches/images are uploaded. The hosted runner
      # is disposable. Never run this workflow against fork code or on self-hosted.
