name: Firmware integration
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact firmware profile
        type: choice
        options: ['2.40', '2.57']
        default: '2.40'
        required: true
permissions:
  contents: read
concurrency:
  group: firmware-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  integration:
    name: Fresh V${{ inputs.version }} integration
    if: github.ref == 'refs/heads/2.x'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FW_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned Docker Engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v28.5.2
      - name: Pinned Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v2.39.4
          cache-binary: false
      - name: Build pinned toolchain and run firmware-free checks
        run: |
          docker build --tag diskos-qemu-ci docker
          docker run --rm --network none --volume "$PWD:/repo:ro" diskos-qemu-ci bash /repo/ci/test.sh
      - name: Download private firmware input
        env:
          FIRMWARE_V240_URL: ${{ secrets.FIRMWARE_V240_URL }}
          FIRMWARE_V257_URL: ${{ secrets.FIRMWARE_V257_URL }}
        run: |
          mkdir "$RUNNER_TEMP/diskos-ota"
          python3 -B tools/fetch_firmware.py "$RUNNER_TEMP/diskos-ota" --version "$FW_VERSION"
      - name: Fresh boot, stock library scan, TCP, WebSocket and PCM
        run: bash ci/integration.sh "$RUNNER_TEMP/diskos-ota"
      # No firmware/rootfs/guest logs/caches/images are uploaded. The hosted runner
      # is disposable. Never run this workflow against fork code or on self-hosted.
