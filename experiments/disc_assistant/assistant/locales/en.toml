# Literal phrases, not regular expressions. Semantic keys are defined in Python.
[commands]
set_language = ["switch language to"]
play = ["play"]
pause = ["pause"]
resume = ["resume"]
stop = ["stop", "stop music"]
next = ["next", "next track"]
previous = ["previous", "previous track"]

like = ["like", "like this track", "like this song"]
dislike = ["dislike", "unlike", "dislike this track", "unlike this song"]
now_playing = ["what is playing", "what is playing now", "what song is playing", "what track is playing", "what’s playing", "what's playing"]
volume = ["volume", "set volume to"]
volume_up = ["louder", "make it louder", "turn it up"]
volume_down = ["quieter", "make it quieter", "turn it down"]

[targets]
album = ["album"]
artist = ["artist"]
track = ["track", "song"]

[versions]
live = ["live", "concert"]
remix = ["remix"]
acoustic = ["acoustic"]
instrumental = ["instrumental"]
demo = ["demo"]
karaoke = ["karaoke"]
cover = ["cover"]
remaster = ["remaster", "remastered"]

[language_names]
ru = ["russian"]
en = ["english"]

