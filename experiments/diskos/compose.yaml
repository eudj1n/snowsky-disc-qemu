# Standalone experiment: does not read the regular .env or use snowsky-disc-work.
# From the repository root, supply OTA_DIR and FW_VERSION explicitly; see DISKOS_PREVIEW.md.
services:
  emulator:
    image: snowsky-disc-qemu-ci
    container_name: diskos-preview
    privileged: true
    command: sleep infinity
    environment:
      FW_VERSION: ${FW_VERSION:?historical preview requires 2.40}
      GUEST_TTL: ${GUEST_TTL:-14400}
      DISKOS_PREVIEW: '1'
      DEVICE_BOOT_SCRIPT: /repo/experiments/diskos/boot.sh
    networks:
      default:
        interface_name: eth1
    volumes:
      - ../..:/repo:ro
      - ${OTA_DIR:?path to matching stock OTA chunks}:/ota:ro
      - ../../work/diskos-preview/sdcard:/sdcard:ro
      - preview:/work
    ports:
      - '127.0.0.1:8081:8080'
    stop_grace_period: 2s
volumes:
  preview:
    name: diskos-preview-${FW_VERSION:?select firmware}-work
