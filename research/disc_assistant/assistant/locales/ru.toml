[commands]
set_language = ["переключи язык на"]
play = ["включи", "играй", "запусти"]
pause = ["пауза", "приостанови"]
resume = ["продолжи"]
stop = ["стоп", "останови музыку", "хватит"]
# Observed Whisper spelling; accept the complete control phrase only.
next = ["следующий", "следующий трек", "следующий трак", "вперед", "вперёд"]
previous = ["предыдущий", "предыдущий трек", "прошлый", "прошлый трек", "назад"]

[targets]
album = ["альбом"]
artist = ["исполнителя"]
track = ["трек", "песню"]

[versions]
live = ["концерт", "концертная"]
remix = ["ремикс"]
acoustic = ["акустика"]
instrumental = ["инструментальная", "инструментал"]
demo = ["демо"]
karaoke = ["караоке"]
cover = ["кавер"]
remaster = ["ремастер", "ремастеринг"]

[language_names]
ru = ["русский", "русский язык"]
en = ["английский", "английский язык"]
