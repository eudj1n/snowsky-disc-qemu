# Optional diagnostic extraction templates for locale contributors.
version = 1
locale = "ru"

[patterns]
play = ["включи {query}", "поставь {query}", "пожалуйста включи {query}", "хочу послушать {query}"]
language = ["переключи язык на {language}", "пожалуйста переключи язык на {language}", "используй {language} язык команд"]
negation = ["не", "никогда", "без"]
reported = ["он сказал", "она сказала", "он попросил", "она попросила", "объясни", "что означает", "как сказать", "на кнопке", "на экране", "кто-то написал", "я сказал", "расскажи"]
empty_music = ["ничего"]
quotes = ["\"", "'", "«", "“"]
