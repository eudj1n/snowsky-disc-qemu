# Optional diagnostic extraction templates for locale contributors.
version = 1
locale = "en"

[patterns]
play = ["play {query}", "put on {query}", "please play {query}", "I want to hear {query}"]
language = ["switch language to {language}", "please switch language to {language}", "use {language} for commands"]
negation = ["do not", "don't", "never", "without"]
reported = ["he said", "she said", "he asked", "she asked", "explain", "what does", "what is", "how do", "the word", "the label", "someone wrote", "I said", "describe"]
empty_music = ["nothing", "none"]
quotes = ["\"", "'", "“", "‘"]
