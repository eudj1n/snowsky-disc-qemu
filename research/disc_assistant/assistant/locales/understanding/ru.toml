# Single-action diagnostic grammar. Literal templates; no locale-specific Python branches.
version = 1
locale = "ru"

[templates]
play = ["включи {query}", "поставь {query}", "играй {query}", "проиграй {query}", "пожалуйста включи {query}", "пожалуйста поставь {query}", "хочу послушать {query}", "хочется услышать {query}", "давай послушаем {query}", "можно послушать {query}", "найди и включи {query}"]
artist = ["можно музыку от {query}", "хочу музыку группы {query}", "давай послушаем группу {query}", "включи группу {query}"]
track = ["проиграй трек {query}", "найди и включи песню {query}"]
language = ["переключи язык на {language}", "пожалуйста переключи язык на {language}", "используй {language} язык команд", "используй {language} язык команд пожалуйста", "отвечай {language}", "отвечай мне теперь {language}", "давай общаться на {language}", "выбери {language} язык", "смени язык на {language}", "перейди на {language}", "хочу {language} интерфейс", "говори со мной на {language}", "для команд выбери {language}", "поменяй язык общения на {language}", "установи {language} язык ответов", "с этого момента общаемся на {language}", "вернемся к {language} языку", "я бы хотел получать ответы {language}", "переведи общение на {language}", "пусть язык ассистента будет {language}"]

[language_names]
ru = ["русский", "русском", "русскому", "русским", "по-русски", "русский язык"]
en = ["английский", "английском", "английскому", "английским", "по-английски", "английский язык"]

[controls]
pause = ["поставь на паузу", "сделай паузу"]
resume = ["пусть музыка играет дальше", "продолжим слушать"]
stop = ["больше не проигрывай музыку", "музыка больше не нужна выключай"]
next = ["включи следующий трек"]
previous = ["включи предыдущий трек"]

[context]
negation = ["не", "никогда"]
reported = ["он сказал", "она сказала", "кто-то написал", "на кнопке", "вчера", "после работы", "это рассказ", "в расписании", "была записана"]
questions = ["что означает", "что значит", "как работает", "почему", "ты можешь", "ты умеешь", "скажи", "объясни", "расскажи"]
nonmusic = ["свет", "свет в комнате", "телевизор", "лампу", "кинофильм"]
connectors = ["и затем", "и потом", "потом", "затем", "после этого", "перед этим", "или лучше", "или", "и"]
action_modifiers = ["может быть", "пожалуйста", "лучше"]
actions = ["включи", "поставь", "играй", "пауза", "приостанови", "останови", "выключи", "продолжи", "переключи", "следующий", "предыдущий"]
empty = ["ничего"]
